name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run example
      - name: SKILL.md section 8 matches scripts/fa_docx.js
        run: |
          python3 - <<'EOF'
          import re, sys
          skill = open("SKILL.md", encoding="utf-8").read()
          block = re.findall(r"```js\n(.*?)```", skill, re.S)[0]
          script = open("scripts/fa_docx.js", encoding="utf-8").read()
          body = "\n".join(l for l in script.splitlines() if not l.startswith("// Persian (Farsi) RTL helpers") and not l.startswith("// Mirrors section 8"))
          if block.strip() != body.strip():
              sys.exit("SKILL.md section 8 and scripts/fa_docx.js differ")
          print("in sync")
          EOF
